<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="naver-site-verification" content="2cbae81508d57b72799f487ff5512096519edd2e" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가계부</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">
    <div class="min-h-screen">
        <header class="bg-white shadow-sm">
            <div class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
                <h1 class="text-2xl font-bold">가계부</h1>
                <p class="mt-1 text-sm text-slate-500">수입과 지출을 간단하게 기록하고 월간 합계를 확인하세요.</p>
            </div>
        </header>

        <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">
            <section class="grid gap-6 lg:grid-cols-3">
                <div class="rounded-2xl bg-white p-6 shadow-sm">
                    <h2 class="text-sm font-medium text-slate-500">총 수입</h2>
                    <p id="total-income" class="mt-2 text-2xl font-bold text-emerald-600">₩0</p>
                    <p class="mt-1 text-xs text-slate-400">이 달 기록 기준</p>
                </div>
                <div class="rounded-2xl bg-white p-6 shadow-sm">
                    <h2 class="text-sm font-medium text-slate-500">총 지출</h2>
                    <p id="total-expense" class="mt-2 text-2xl font-bold text-rose-600">₩0</p>
                    <p class="mt-1 text-xs text-slate-400">이 달 기록 기준</p>
                </div>
                <div class="rounded-2xl bg-white p-6 shadow-sm">
                    <h2 class="text-sm font-medium text-slate-500">잔액</h2>
                    <p id="total-balance" class="mt-2 text-2xl font-bold text-slate-900">₩0</p>
                    <p class="mt-1 text-xs text-slate-400">수입 - 지출</p>
                </div>
            </section>

            <section class="mt-8 grid gap-6 lg:grid-cols-[2fr_3fr]">
                <div class="rounded-2xl bg-white p-6 shadow-sm">
                    <h2 class="text-lg font-semibold">새 항목 추가</h2>
                    <form id="entry-form" class="mt-4 space-y-4">
                        <div>
                            <label for="entry-date" class="block text-sm font-medium text-slate-600">날짜</label>
                            <input type="date" id="entry-date" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" required>
                        </div>
                        <div>
                            <label for="entry-type" class="block text-sm font-medium text-slate-600">구분</label>
                            <div class="mt-2 flex gap-3">
                                <label class="flex items-center gap-2 rounded-lg border border-slate-200 px-3 py-2 text-sm">
                                    <input type="radio" name="entry-type" value="income" checked>
                                    수입
                                </label>
                                <label class="flex items-center gap-2 rounded-lg border border-slate-200 px-3 py-2 text-sm">
                                    <input type="radio" name="entry-type" value="expense">
                                    지출
                                </label>
                            </div>
                        </div>
                        <div>
                            <label for="entry-category" class="block text-sm font-medium text-slate-600">카테고리</label>
                            <select id="entry-category" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" required>
                                <option value="월급">월급</option>
                                <option value="식비">식비</option>
                                <option value="교통">교통</option>
                                <option value="생활">생활</option>
                                <option value="저축">저축</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>
                        <div>
                            <label for="entry-description" class="block text-sm font-medium text-slate-600">메모</label>
                            <input type="text" id="entry-description" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="예: 점심 도시락" maxlength="40">
                        </div>
                        <div>
                            <label for="entry-amount" class="block text-sm font-medium text-slate-600">금액</label>
                            <div class="relative mt-1">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">₩</span>
                                <input type="number" id="entry-amount" class="w-full rounded-lg border border-slate-200 px-8 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="0" min="0" step="100" required>
                            </div>
                        </div>
                        <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500">기록 추가</button>
                    </form>
                </div>

                <div class="rounded-2xl bg-white p-6 shadow-sm">
                    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                        <div>
                            <h2 class="text-lg font-semibold">기록 목록</h2>
                            <p class="text-sm text-slate-500">이번 달 입력된 항목을 확인하세요.</p>
                        </div>
                        <div class="flex items-center gap-2 text-sm text-slate-600">
                            <label for="filter-month">월 선택</label>
                            <input type="month" id="filter-month" class="rounded-lg border border-slate-200 px-2 py-1 text-sm">
                        </div>
                    </div>
                    <div class="mt-4 overflow-x-auto">
                        <table class="min-w-full text-left text-sm">
                            <thead class="border-b border-slate-200 text-slate-500">
                                <tr>
                                    <th class="px-2 py-2">날짜</th>
                                    <th class="px-2 py-2">구분</th>
                                    <th class="px-2 py-2">카테고리</th>
                                    <th class="px-2 py-2">메모</th>
                                    <th class="px-2 py-2 text-right">금액</th>
                                    <th class="px-2 py-2"></th>
                                </tr>
                            </thead>
                            <tbody id="entries-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                    <p id="empty-state" class="mt-4 text-center text-sm text-slate-400">아직 기록이 없습니다.</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        const entryForm = document.getElementById('entry-form');
        const entriesBody = document.getElementById('entries-body');
        const emptyState = document.getElementById('empty-state');
        const totalIncome = document.getElementById('total-income');
        const totalExpense = document.getElementById('total-expense');
        const totalBalance = document.getElementById('total-balance');
        const filterMonth = document.getElementById('filter-month');

        const STORAGE_KEY = 'kikit-ledger-entries';

        const formatCurrency = (value) => new Intl.NumberFormat('ko-KR', {
            style: 'currency',
            currency: 'KRW',
            maximumFractionDigits: 0,
        }).format(value);

        const toMonthKey = (dateString) => dateString.slice(0, 7);

        const loadEntries = () => {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (!stored) {
                return [];
            }
            try {
                return JSON.parse(stored);
            } catch (error) {
                console.error('저장된 데이터를 불러오는 중 오류가 발생했습니다.', error);
                return [];
            }
        };

        const saveEntries = (entries) => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        };

        const getSelectedMonth = () => {
            if (!filterMonth.value) {
                const today = new Date();
                return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            }
            return filterMonth.value;
        };

        const renderEntries = (entries) => {
            const selectedMonth = getSelectedMonth();
            const filtered = entries.filter((entry) => toMonthKey(entry.date) === selectedMonth);

            entriesBody.innerHTML = '';
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach((entry) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-2 py-3 text-slate-600">${entry.date}</td>
                    <td class="px-2 py-3">
                        <span class="rounded-full px-2 py-1 text-xs font-semibold ${entry.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                            ${entry.type === 'income' ? '수입' : '지출'}
                        </span>
                    </td>
                    <td class="px-2 py-3 text-slate-600">${entry.category}</td>
                    <td class="px-2 py-3 text-slate-500">${entry.description || '-'}</td>
                    <td class="px-2 py-3 text-right font-medium ${entry.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">${formatCurrency(entry.amount)}</td>
                    <td class="px-2 py-3 text-right">
                        <button type="button" class="delete-entry text-xs text-slate-400 hover:text-rose-500" data-id="${entry.id}">삭제</button>
                    </td>
                `;
                entriesBody.appendChild(row);
            });

            updateSummary(filtered);
        };

        const updateSummary = (entries) => {
            const income = entries.filter((entry) => entry.type === 'income').reduce((sum, entry) => sum + entry.amount, 0);
            const expense = entries.filter((entry) => entry.type === 'expense').reduce((sum, entry) => sum + entry.amount, 0);
            const balance = income - expense;

            totalIncome.textContent = formatCurrency(income);
            totalExpense.textContent = formatCurrency(expense);
            totalBalance.textContent = formatCurrency(balance);
            totalBalance.className = `mt-2 text-2xl font-bold ${balance >= 0 ? 'text-slate-900' : 'text-rose-600'}`;
        };

        const resetForm = () => {
            entryForm.reset();
            document.querySelector('input[name="entry-type"][value="income"]').checked = true;
            const today = new Date();
            document.getElementById('entry-date').value = today.toISOString().split('T')[0];
        };

        let entries = loadEntries();
        resetForm();
        filterMonth.value = getSelectedMonth();
        renderEntries(entries);

        entryForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const entry = {
                id: crypto.randomUUID(),
                date: document.getElementById('entry-date').value,
                type: document.querySelector('input[name="entry-type"]:checked').value,
                category: document.getElementById('entry-category').value,
                description: document.getElementById('entry-description').value.trim(),
                amount: Number(document.getElementById('entry-amount').value),
            };

            entries = [entry, ...entries];
            saveEntries(entries);
            renderEntries(entries);
            resetForm();
        });

        filterMonth.addEventListener('change', () => {
            renderEntries(entries);
        });

        entriesBody.addEventListener('click', (event) => {
            const button = event.target.closest('.delete-entry');
            if (!button) {
                return;
            }
            const id = button.dataset.id;
            entries = entries.filter((entry) => entry.id !== id);
            saveEntries(entries);
            renderEntries(entries);
        });
    </script>
</body>
</html>
